name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: |
            DataMigrator.csproj
            tests/DataMigrator.Tests/DataMigrator.Tests.csproj
      - name: Restore
        run: dotnet restore tests/DataMigrator.Tests/DataMigrator.Tests.csproj --configfile nuget.config
      - name: Build
        run: dotnet build tests/DataMigrator.Tests/DataMigrator.Tests.csproj -c Release --no-restore
      - name: Test
        run: dotnet test tests/DataMigrator.Tests/DataMigrator.Tests.csproj -c Release --no-build --no-restore
      - name: Build container
        run: docker build --tag atspm-data-migrator:ci .
